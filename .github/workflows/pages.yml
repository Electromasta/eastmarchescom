# Build the Angular site and publish it to GitHub Pages on every push to master.
# The custom domain is set in the repo's Settings → Pages (a CNAME file isn't used with Actions).
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The lockfile was written by a newer npm (v3 format), which Node 14's npm can't read.
      # Angular 9 still runs on Node 18 with OpenSSL's legacy provider (same as the local build script).
      - uses: actions/setup-node@v7
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      # Served at https://electromasta.github.io/<repo>/ for now. Once a custom domain is set in
      # Settings → Pages, change BASE_HREF to /
      - run: npx ng build --prod --base-href "$BASE_HREF"
        env:
          BASE_HREF: /${{ github.event.repository.name }}/
          NODE_OPTIONS: --openssl-legacy-provider
      # Routes are handled in the browser: serve the app for unknown paths too, so deep links work
      - run: cp dist/eastmarches/index.html dist/eastmarches/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/eastmarches

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
